# render.yaml - Infraestructure as Code (IaC)
# Infrastructure como código
services:
  - type: web
    name: sensorhub-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      # Inyectamos la URL de la base de datos de Render automáticamente a la API
      - key: DATABASE_URL
        fromDatabase:
          name: sensorhub-db
          property: connectionString

databases:
  - name: sensorhub-db
    plan: free