# .github/workflows/ci.yml
name: CI

# El robot se activará cuando alguien haga un "push" a la rama main,
# o cuando alguien abra un Pull Request hacia la rama main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # El entorno virtual donde correrá el robot (un servidor Linux en la nube)
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Descargar tu código al servidor de GitHub
      - uses: actions/checkout@v4
      
      # Paso 2: Instalar el "manager" (Python)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      # Paso 3: Instalar dependencias (Soldar los componentes)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff mypy httpx
          
      # Paso 4: Pasar el escáner de código limpio
      - name: Linting with Ruff
        run: ruff check .
        
      # Paso 5: Pasar el escáner de "Falsos Contactos" (Tipado estricto)
      - name: Type checking with Mypy
        run: mypy app --ignore-missing-imports
        
      # Paso 6: Pasar el osciloscopio final (Pruebas unitarias)
      - name: Run Tests
        run: pytest --cov=app --cov-fail-under=80