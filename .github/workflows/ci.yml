# .github/workflows/ci.yml
name: CI Pipeline

# El robot se activará cuando alguien haga un "push" a cualquier rama
# o abra un Pull Request hacia main.
on:
  push:
    branches:
      - '**' # <--- Este comodín (asterisco doble) significa "TODAS las ramas"
  pull_request:
    branches: [main]

jobs:
  test:
    # El entorno virtual donde correrá el robot (un servidor Linux en la nube)
    runs-on: ubuntu-latest
    environment: production #Agregamos un entorno de producción para el pipeline

    # ---> NUEVO: INYECTAR POSTGRESQL EN EL PIPELINE (EXTENSIÓN) <---
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sensor
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: sensorhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Paso 1: Descargar tu código al servidor de GitHub
      - uses: actions/checkout@v4
      
      # Paso 2: Instalar el "manager" (Python)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip' # (Optimizado: Activa caché para descargar dependencias más rápido)
          
      # Paso 3: Instalar dependencias (Soldar los componentes)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff mypy httpx
          
      # Paso 4: Pasar el escáner de código limpio
      - name: Linting with Ruff
        run: ruff check .
        
      # Paso 5: Pasar el escáner de "Falsos Contactos" (Tipado estricto)
      - name: Type checking with Mypy
        run: mypy app --ignore-missing-imports

      # Paso 6: Pruebas Unitarias (SQLite en memoria)
      - name: Unit Tests
        run: pytest --cov=app --cov-fail-under=80

      # Paso 7 - SMOKE TEST CONTRA POSTGRESQL REAL
      - name: Smoke Test (PostgreSQL Real)
        env:
          DATABASE_URL: postgresql+psycopg://sensor:secretpassword@localhost:5432/sensorhub_test
        run: |
          echo "Corriendo migraciones en PostgreSQL..."
          alembic upgrade head
          echo "Ejecutando Smoke Test..."
          python tests/smoke_test.py

      # Paso 8 - EXTENSIÓN DevSecOps
      # (Desarrollo, Seguridad y Operaciones).
      - name: Construir imagen Docker local para escaneo
        run: docker build -t sensorhub:latest .

      - name: Escáner de Vulnerabilidades Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sensorhub:latest'
          format: 'table'
          # Lo ponemos en 0 para auditar. En un entorno mega estricto se pone en 1 para que falle si encuentra algo.
          exit-code: '0' 
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Paso 9 - BOT GUARDIÁN   
      - name: Crear Issue si el Pipeline falla en MAIN
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Pipeline Roto en Producción (MAIN)',
              body: `El pipeline de CI/CD falló en el commit ${context.sha}.\n\nRevisa los logs de inmediato aquí: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'urgente']
            })